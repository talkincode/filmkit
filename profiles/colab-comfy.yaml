# Ready-to-use Profile: ComfyUI API workflows on a Google Colab GPU (L4 default).
# First template: MiniMax H3 Ref2VA (reference image(s) + prompt -> video with audio),
# optional VSA sparsity gate.
#
# Two-phase by design (filmkit runs one node at a time; a Colab session costs
# ~8 min of setup, so it is shared by a batch):
#   1. colab-comfy batch --film filmkit.yaml [--yes] [--budget CU]
#        one Colab session for every pending colab-comfy node; CU estimate and
#        hard budget gate first; guaranteed `colab stop` + `colab sessions` check.
#        Clips land in ./.colab-comfy/cache (gitignore it).
#   2. filmkit run <id>   (batch does this for you)
#        `colab-comfy materialize`: local copy cache -> produces + run record. Free.
#        On a cache miss it refuses (exit 5 -> invalid-input) unless
#        COLAB_COMFY_YES=1, which runs a batch of one under the same budget gate.
#
# Credentials: Google ADC on the host (`colab --auth adc`). filmkit never sees
# them; the helper never prints them.
#
#   scenes:
#     - id: s1a
#       duration: 4.05
#       durationPolicy: exact          # the model's frame grid rounds up; trim to the cut
#       impl:
#         profile: colab-comfy
#         task: h3-ref2va
#         params:
#           template: h3-ref2va@1
#           prompt: "The woman from <Picture 1> … talks to the camera …"
#           ref: ./refs/ff_yM.png
#           seed: 20261017              # literal integer (not ${vars.x}: vars become strings)
#           duration: 4.05
#           resolution: 704x1280
#           sparsity: 0.75              # 0 = dense (default), 0.5 / 0.75 = VSA gate
#           audio: ./media/vo/h3/s1a.wav  # optional lip-sync guide (WAV, <= clip length; template @2), see below
#       produces:
#         video: ./build/h3/s1a.mp4
#         file: ./build/h3/s1a.colab.json   # run record: seed, hashes, versions, GPU, CU
#
# Audio guide (lip sync): needs `template: h3-ref2va@2` (same models and pins as
# @1, which stays frozen). `params.audio` is a film-relative WAV (the scene's VO
# segment). It is uploaded with the refs and fed through LoadAudio ->
# MiniMaxH3AddGuide (frame_idx 0) into the conditioning, so the mouth follows
# that audio instead of only the image + prompt. Starts at the clip's first
# frame; must not be longer than the generated clip (frames / 24 s), shorter is
# fine (the rest is unguided). Its bytes are in the cache key: new audio, new
# render. Without `audio` the workflow is exactly the template's. It is NOT
# taken from `produces.audio` automatically: declaring it is the opt-in.
#
# Task h3-fl2va (template h3-fl2va@1): the 李律 EP01 / 微辣 EP03 lip-sync
# pipeline. MiniMax H3 FL2VA (pruned int8) + fl2v turbo 8-step LoRA; the clip
# STARTS from `image` (the real first frame, stretched to the canvas: same
# aspect ratio required) and the mouth is driven by `audio` (required WAV,
# LoadAudio -> MiniMaxH3AddGuide frame 0, <= clip length). No refs, no VSA.
#
#         task: h3-fl2va
#         params:
#           template: h3-fl2va@1
#           prompt: "<竖屏中景>首帧里同一位女性……用普通话对镜头说话，口型与配音同步……"
#           image: ./media/kf/s1a.png     # first frame, same aspect as resolution
#           audio: ./media/vo/h3/s1a.wav  # driving audio from frame 0
#           seed: 20261017
#           duration: 4.05
#           resolution: 768x1024
#
# Candidates: set `candidates: 3`; batch renders seeds seed..seed+2; review the
# printed cache paths; set `pick: <index>`; `filmkit run` copies the winner (no CU).
apiVersion: filmkit/v1alpha1
kind: Profile
metadata:
  name: colab-comfy
  version: "0.1"
  description: ComfyUI API workflows on a Google Colab GPU, batched per session (MiniMax H3 Ref2VA + optional VSA gate; H3 FL2VA first frame + driving audio).
runtime:
  type: cli
  binary: colab-comfy
  requires:
    binaries: [colab]
  healthcheck: ["colab-comfy", "doctor", "--json"]
  healthcheckExpect: { path: ready, equals: true }
  exitCodes: { "0": ok, "1": io, "2": invalid-input, "3": missing-dependency, "4": tool-failure, "5": invalid-input }
capabilities:
  produces: [video, file]
  consumes: [image]
tasks:
  h3-ref2va:
    description: MiniMax H3 Ref2VA on Colab; filmkit run materializes from the batch cache.
    produces: [video, file]
    paramsSchema:
      type: object
      additionalProperties: false
      required: [template, prompt, ref, seed, duration, resolution]
      properties:
        template:
          enum: [h3-ref2va@1, h3-ref2va@2]
          description: Versioned template + pinned model manifest. Bump to re-render under new pins. @2 = @1 plus the audio guide (params.audio); @1 is frozen and refuses audio.
        prompt:
          type: string
          minLength: 1
          description: Written by the agent. Refer to refs as <Picture 1>, <Picture 2>, <Picture 3>.
        ref:   { type: string, pattern: "^\\.\\.?/", description: "Reference image 1 (film-relative)." }
        ref2:  { type: string, pattern: "^\\.\\.?/", description: "Optional reference image 2." }
        ref3:  { type: string, pattern: "^\\.\\.?/", description: "Optional reference image 3." }
        seed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        duration:
          type: number
          exclusiveMinimum: 0
          maximum: 6.6
          description: Seconds at 24 fps; rounded UP to the model's valid frame count (recorded).
        resolution:
          enum: ["1344x768", "768x1344", "1280x704", "704x1280", "1024x768", "768x1024"]
          description: WIDTHxHEIGHT; 16:9 / 9:16 (1344x768, 768x1344, 1280x704, 704x1280) or 4:3 / 3:4 (1024x768, 768x1024).
        audio:
          type: string
          pattern: "^\\.\\.?/"
          description: Optional lip-sync guide, film-relative RIFF/WAVE file starting at frame 0 (e.g. the scene's VO segment); fed to MiniMaxH3AddGuide. Must not be longer than the generated clip.
        sparsity:
          enum: [0, 0.5, 0.75]
          description: 0 = dense template; 0.5 / 0.75 = VSA gate template with that sparsity. Default 0.
        candidates:
          type: integer
          minimum: 1
          maximum: 4
          description: Render seeds seed..seed+N-1 in the batch. Default 1.
        pick:
          type: integer
          minimum: 0
          maximum: 3
          description: Winning candidate index; required by materialize when candidates > 1.
    validate:
      - colab-comfy
      - validate
      - "--node=${node.id}"
      - "--template=${params.template}"
      - "--prompt=${params.prompt}"
      - "--ref=${params.ref}"
      - "--ref2=${params.ref2?}"
      - "--ref3=${params.ref3?}"
      - "--seed=${params.seed}"
      - "--duration=${params.duration}"
      - "--resolution=${params.resolution}"
      - "--sparsity=${params.sparsity?}"
      - "--candidates=${params.candidates?}"
      - "--pick=${params.pick?}"
      - "--audio=${params.audio?}"
      - "--out=${produces.video}"
      - "--record=${produces.file}"
    invocation:
      - colab-comfy
      - materialize
      - "--node=${node.id}"
      - "--template=${params.template}"
      - "--prompt=${params.prompt}"
      - "--ref=${params.ref}"
      - "--ref2=${params.ref2?}"
      - "--ref3=${params.ref3?}"
      - "--seed=${params.seed}"
      - "--duration=${params.duration}"
      - "--resolution=${params.resolution}"
      - "--sparsity=${params.sparsity?}"
      - "--candidates=${params.candidates?}"
      - "--pick=${params.pick?}"
      - "--audio=${params.audio?}"
      - "--out=${produces.video}"
      - "--record=${produces.file}"
  h3-fl2va:
    description: MiniMax H3 FL2VA (first frame + driving audio, turbo 8-step) on Colab; lip sync as in 李律 EP01 / 微辣 EP03.
    produces: [video, file]
    paramsSchema:
      type: object
      additionalProperties: false
      required: [template, prompt, image, audio, seed, duration, resolution]
      properties:
        template:
          enum: [h3-fl2va@1]
          description: Versioned template + pinned model manifest (fl2va pruned int8 + fl2v turbo 8-step LoRA).
        prompt:
          type: string
          minLength: 1
          description: Written by the agent (Chinese works best, as in EP01/EP03). Describe the person as in the first frame (首帧); no <Picture N>.
        image:
          type: string
          pattern: "^\\.\\.?/"
          description: The clip's first frame (film-relative PNG/JPEG/WebP). Stretched to the canvas, so it must have the resolution's aspect ratio.
        audio:
          type: string
          pattern: "^\\.\\.?/"
          description: Driving audio (film-relative RIFF/WAVE, the scene's VO segment) from frame 0, fed to MiniMaxH3AddGuide. Must not be longer than the generated clip.
        seed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        duration:
          type: number
          exclusiveMinimum: 0
          maximum: 6.6
          description: Seconds at 24 fps; rounded UP to the model's valid frame count 5+17k (recorded).
        resolution:
          enum: ["1344x768", "768x1344", "1280x704", "704x1280", "1024x768", "768x1024"]
          description: WIDTHxHEIGHT, same list as h3-ref2va. EP01/EP03 ran 704x1280.
        candidates:
          type: integer
          minimum: 1
          maximum: 4
          description: Render seeds seed..seed+N-1 in the batch. Default 1.
        pick:
          type: integer
          minimum: 0
          maximum: 3
          description: Winning candidate index; required by materialize when candidates > 1.
    validate:
      - colab-comfy
      - validate
      - "--node=${node.id}"
      - "--template=${params.template}"
      - "--prompt=${params.prompt}"
      - "--image=${params.image}"
      - "--audio=${params.audio}"
      - "--seed=${params.seed}"
      - "--duration=${params.duration}"
      - "--resolution=${params.resolution}"
      - "--candidates=${params.candidates?}"
      - "--pick=${params.pick?}"
      - "--out=${produces.video}"
      - "--record=${produces.file}"
    invocation:
      - colab-comfy
      - materialize
      - "--node=${node.id}"
      - "--template=${params.template}"
      - "--prompt=${params.prompt}"
      - "--image=${params.image}"
      - "--audio=${params.audio}"
      - "--seed=${params.seed}"
      - "--duration=${params.duration}"
      - "--resolution=${params.resolution}"
      - "--candidates=${params.candidates?}"
      - "--pick=${params.pick?}"
      - "--out=${produces.video}"
      - "--record=${produces.file}"
