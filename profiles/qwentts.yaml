# Ready-to-use Profile for qwentts (https://github.com/talkincode/qwentts),
# local Qwen3-TTS narration: CustomVoice presets with emotion control, Base
# voice cloning from a reference clip, and VoiceDesign from a description.
#
# Install (macOS + Apple Silicon only — MLX; the qwentts README has the details):
#   1. runtime:  export QWEN3_TTS_HOME="$HOME/mlx-audio-qwen3-tts"   # the default
#                uv venv "$QWEN3_TTS_HOME/.venv" --python 3.12
#                uv pip install --python "$QWEN3_TTS_HOME/.venv/bin/python" -U mlx-audio
#   2. models:   "$QWEN3_TTS_HOME/.venv/bin/hf" download \
#                  mlx-community/Qwen3-TTS-12Hz-1.7B-CustomVoice-8bit \
#                  --local-dir "$QWEN3_TTS_HOME/models/qwen3-tts-12hz-1.7b-customvoice-8bit"
#                (Base for cloning, VoiceDesign for described voices; ~3 GB each.
#                 QWEN3_TTS_MODELS_DIR overrides just the models directory.)
#   3. this Profile needs the script on PATH:
#                git clone https://github.com/talkincode/qwentts
#                ln -sf "$PWD/qwentts/skills/qwentts/scripts/qwen3-tts-ai" ~/.local/bin/qwen3-tts-ai
#                qwen3-tts-ai --print-models     # doctor runs this: no model load, no generation
# `--print-models` also prints the resolved app/models/python paths, but nothing
# can see whether the weights exist: a missing model surfaces at `filmkit run`
# with the tool's own message (pass `allowDownload: true` to let it fetch, or
# pre-download as in step 2).
#
# Use it in a film:
#   assets:
#     voice:
#       kind: audio
#       impl:
#         profile: qwentts
#         task: speak
#         params: { text: "深夜的律所走廊…", model: customvoice, voice: Serena, emotionIntensity: low, speed: 0.98 }
#       produces: { audio: ./build/voice/s1.wav }
#   scenes:
#     - id: s1
#       durationPolicy: min      # the narration decides the scene length
#       audio: voice             # this scene's narration comes from that asset
#       impl: { profile: filmkit/static, task: clip }
#       produces: { image: ./assets/card.png }
#
# Cloning route: `model: base` with `referenceAudio` (a ./ path, or a file from a
# voice library — the repo ships one sample under skills/qwentts/speakers/ and
# keeps personal libraries in its gitignored myspeakers/) and, when you know it,
# `refText` with the exact words in that clip — better quality, never invented.
#
# filmkit never writes the text and never picks a voice: those are the agent's
# creative decisions, passed through `params`.
apiVersion: filmkit/v1alpha1
kind: Profile
metadata:
  name: qwentts
  version: ">=0.2"
  description: Local Qwen3-TTS narration — preset voices with emotion control, reference-audio cloning, voice design.
runtime:
  type: cli
  binary: qwen3-tts-ai
  # Prints aliases, speakers and the resolved runtime paths, then exits: proves
  # the script runs without loading a model or spending generation time.
  healthcheck: ["qwen3-tts-ai", "--print-models"]
  exitCodes: { "0": ok, "2": invalid-input }
capabilities:
  produces: [audio]
tasks:
  speak:
    description: qwen3-tts-ai — one text to one narration file.
    paramsSchema:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: What to say. The agent writes it; filmkit never generates prose.
        model:
          enum: [customvoice, custom-voice, base, voice-design, voicedesign]
          description: 'customvoice: preset speaker + emotion/style. base: clone from referenceAudio. voice-design: describe a voice in instruct.'
        voice:
          type: string
          description: 'CustomVoice speaker (Vivian, Serena, Uncle_Fu, Dylan, Eric — Chinese; Ryan, Aiden — English; Ono_Anna — Japanese; Sohee — Korean) or a Base speaker name.'
        mode:
          enum: [fast, quality]
          description: Generation preset; quality is slower and steadier. Default fast.
        instruct:
          type: string
          description: Style/emotion instruction for customvoice, or the voice description for voice-design.
        emotionIntensity:
          enum: [auto, flat, low, medium, high, extreme]
          description: Emotion strength (customvoice only). Leave at auto unless the scene calls for more.
        speed:
          type: number
          exclusiveMinimum: 0
          description: Playback speed multiplier, e.g. 0.98.
        temperature:
          type: number
          exclusiveMinimum: 0
        topP:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        topK:
          type: integer
          minimum: 0
          description: Top-k sampling.
        repetitionPenalty:
          type: number
          exclusiveMinimum: 0
          description: Repetition penalty; raise it when the voice loops.
        maxTokens:
          type: integer
          minimum: 1
          description: Generation length ceiling; mode sets a default (fast 1200, quality 4096).
        langCode:
          type: string
          description: 'Language hint, e.g. auto, zh, en, Chinese. Default auto.'
        referenceAudio:
          type: string
          description: 'Reference clip for base cloning (a ./ path inside the film, or an absolute path to a voice library file).'
        refText:
          type: string
          description: Exact transcript of referenceAudio, when you know it. Never invent it.
        sttModel:
          type: string
          description: STT model used by auto-transcribing the reference clip.
        flags:
          type: array
          description: 'Valueless CLI flags, named verbatim. The tool takes these without a value (`--allow-download`, `--auto-transcribe-reference`), so they cannot be written as `--flag=<bool>`.'
          items:
            enum: [--allow-download, --auto-transcribe-reference]
      # The tool's three routes are mutually exclusive, and it fails on wrong
      # combinations itself. Note the `required` guard in every `if`: JSON Schema
      # `properties` inside `if` also matches when the property is absent, so
      # without it the rule would fire for every film that omits the key. Those same rules are mirrored here so a mistake
      # fails `filmkit validate` instead of spending a generation. (`instruct`
      # on base is only a warning in the tool, so it is allowed here too.)
      allOf:
        - if: { required: [model], properties: { model: { const: voice-design } } }
          then:
            required: [instruct]
            properties: { voice: false, referenceAudio: false, refText: false, emotionIntensity: false }
        - if: { required: [model], properties: { model: { const: voicedesign } } }
          then:
            required: [instruct]
            properties: { voice: false, referenceAudio: false, refText: false, emotionIntensity: false }
        - if: { required: [model], properties: { model: { const: customvoice } } }
          then:
            properties: { referenceAudio: false, refText: false }
        - if: { required: [model], properties: { model: { const: custom-voice } } }
          then:
            properties: { referenceAudio: false, refText: false }
        - if: { required: [refText] }
          then: { required: [referenceAudio] }
        - if: { required: [flags], properties: { flags: { contains: { const: --auto-transcribe-reference } } } }
          then: { required: [referenceAudio] }
    produces: [audio]
    invocation:
      - qwen3-tts-ai
      - "--text=${params.text}"
      - "--output=${produces.audio}"
      - "--model=${params.model?}"
      - "--voice=${params.voice?}"
      - "--mode=${params.mode?}"
      - "--instruct=${params.instruct?}"
      - "--emotion-intensity=${params.emotionIntensity?}"
      - "--speed=${params.speed?}"
      - "--temperature=${params.temperature?}"
      - "--top-p=${params.topP?}"
      - "--top-k=${params.topK?}"
      - "--repetition-penalty=${params.repetitionPenalty?}"
      - "--max-tokens=${params.maxTokens?}"
      - "--lang-code=${params.langCode?}"
      - "--reference-audio=${params.referenceAudio?}"
      - "--ref-text=${params.refText?}"
      - "--stt-model=${params.sttModel?}"
      - "${params.flags?}"
